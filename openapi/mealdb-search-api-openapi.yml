openapi: 3.2.0
info:
  title: TheMealDB Search API
  version: '2.0'
  description: Search and browse TheMealDB's crowd-sourced meals, recipes, cuisines, categories, and ingredient data. Access level and result limits depend on the supplied API key. Obtain access and review current terms on the official documentation page. API keys are deliberately not included in this specification.
  termsOfService: https://www.themealdb.com/terms_of_use.php
  contact:
    name: TheMealDB
    url: https://www.themealdb.com/contact.php
    email: thedatadb@gmail.com
  license:
    name: TheMealDB Terms of Use
    url: https://www.themealdb.com/terms_of_use.php
servers:
- url: https://www.themealdb.com/api/json/v2
  description: Premium V2 API
tags:
- name: Search
paths:
  /{apiKey}/search.php:
    get:
      tags:
      - Search
      summary: Search for meals
      description: Supply exactly one search parameter. Use `s` for a full or partial meal-name search, or `f` for meals beginning with one letter.
      operationId: searchV2
      parameters:
      - $ref: '#/components/parameters/ApiKey'
      - $ref: '#/components/parameters/MealName'
      - $ref: '#/components/parameters/FirstLetter'
      responses:
        '200':
          description: Matching meal records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MealsResponse'
components:
  parameters:
    MealName:
      name: s
      in: query
      required: false
      description: Full or partial meal name.
      schema:
        type: string
        minLength: 1
    FirstLetter:
      name: f
      in: query
      required: false
      description: First letter of a meal name.
      schema:
        type: string
        pattern: ^[A-Za-z]$
    ApiKey:
      name: apiKey
      in: path
      required: true
      description: Your TheMealDB API key. No key value is stored in this specification.
      schema:
        type: string
        minLength: 1
  schemas:
    MealsResponse:
      type: object
      required:
      - meals
      properties:
        meals:
          oneOf:
          - type: array
            items:
              $ref: '#/components/schemas/Meal'
          - type: object
            description: Legacy access-level message.
            additionalProperties: true
          - type: string
            description: Legacy no-data or access-level message.
          - type: 'null'
    Meal:
      allOf:
      - $ref: '#/components/schemas/MealSummary'
      - type: object
        properties:
          strMealAlternate:
            type:
            - string
            - 'null'
          strTags:
            type:
            - string
            - 'null'
          strCategory:
            type:
            - string
            - 'null'
          strInstructions:
            type:
            - string
            - 'null'
          strYoutube:
            type:
            - string
            - 'null'
          strSource:
            type:
            - string
            - 'null'
          strImageSource:
            type:
            - string
            - 'null'
          strCreativeCommonsConfirmed:
            type:
            - string
            - 'null'
          dateModified:
            type:
            - string
            - 'null'
            description: Database timestamp in `YYYY-MM-DD HH:MM:SS` format.
        patternProperties:
          ^strIngredient([1-9]|1[0-9]|20)$:
            type:
            - string
            - 'null'
          ^strMeasure([1-9]|1[0-9]|20)$:
            type:
            - string
            - 'null'
    MealSummary:
      type: object
      required:
      - idMeal
      - strMeal
      properties:
        idMeal:
          oneOf:
          - type: integer
          - type: string
          description: Numeric meal identifier.
        strMeal:
          type: string
        strMealThumb:
          type:
          - string
          - 'null'
          format: uri
        strArea:
          type:
          - string
          - 'null'
        strCountry:
          type:
          - string
          - 'null'
externalDocs:
  description: Official API documentation
  url: https://www.themealdb.com/documentation
x-provenance:
  method: harvested
  publisher: TheMealDB
  source: https://www.themealdb.com/api/spec/openapi-v2.yaml
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
